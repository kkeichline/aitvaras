[project]
name = "aitvaras"
version = "0.1.0"
description = "A multi-agent oversight benchmark: can a weaker monitor catch a stronger trading agent breaking rules?"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.15",
]

[project.optional-dependencies]
llm = ["litellm>=1.55"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[project.scripts]
aitvaras = "aitvaras.runner.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aitvaras"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# pytest puts tests/ on sys.path, so helpers import as top-level modules.
"tests/*" = ["E402"]
